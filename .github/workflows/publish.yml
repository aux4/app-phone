name: Publish package
on:
  workflow_dispatch:
    inputs:
      level:
        description: Release level
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: aux4/action@v1
        with:
          command: publish
          level: ${{ inputs.level }}
          aux4_token: ${{ secrets.AUX4_ACCESS_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
